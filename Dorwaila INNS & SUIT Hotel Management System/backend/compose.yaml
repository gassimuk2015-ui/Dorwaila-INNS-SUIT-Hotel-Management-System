services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dorwaila
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    volumes:
      - hotel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d dorwaila"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hotel:${POSTGRES_PASSWORD}@db:5432/dorwaila
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  hotel_postgres:

